<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .node-label { font: 600 18px sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
    .node { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.5; }
  </style>

  <!-- C -> G, C -> Y, and G -> Y -->
  <path class="edge" d="M310,105 L225,210"/>
  <path class="edge" d="M390,105 L475,210"/>
  <path class="edge" d="M278,250 L422,250"/>

  <ellipse class="node" cx="350" cy="75" rx="82" ry="38"/>
  <ellipse class="node" cx="200" cy="250" rx="68" ry="38"/>
  <ellipse class="node" cx="500" cy="250" rx="84" ry="38"/>
  <text class="node-label" x="350" y="75">Category (C)</text>
  <text class="node-label" x="200" y="250">Goal (G)</text>
  <text class="node-label" x="500" y="250">Outcome (Y)</text>

</svg>
